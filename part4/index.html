<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - List of Places</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="HBnB logo" class="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <a href="#" id="logout-link" class="login-button">Logout</a>
        </nav>
    </header>

    <main>
        <h1>Available Places</h1>

        <section id="filter">
            <label for="price-filter">Max price per night:</label>
            <select id="price-filter">
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all" selected>All</option>
            </select>
        </section>

        <section id="places-list"></section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
